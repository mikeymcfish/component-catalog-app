name: Feature request
description: Suggest an improvement to Component Catalog.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first so contributors can evaluate the smallest
        useful solution. Do not include private inventory data or credentials.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: I removed secrets and private inventory data from this request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like, including a small example if useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized mockups, synthetic examples, or related links.
